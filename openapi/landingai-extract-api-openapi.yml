                  - type: 'null'
                  default: null
                  description: URL to fetch the markdown from. Must be a public http(s) URL; private/loopback IPs are rejected at submit time. JSON-serialized string in form data.
                  title: Markdown Url
                model:
                  anyOf:
                  - type: string
                  - type: 'null'
