openapi: 3.2.0
info:
  title: Vision Tools API
  version: 0.1.0
servers:
- url: https://api.va.landing.ai
  description: Production vision tools API
tags:
- name: Tools
paths:
  /v1/tools/agentic-document-analysis:
    post:
      tags:
      - Tools
      summary: Agentic Document Extraction (Legacy)
      description: 'This is a legacy endpoint. Use the ADE Parse endpoint instead.


        Send

        documents to the Agentic Document Extraction API.


        The API parses the

        documents and returns the extracted data as structured Markdown and JSON.


        You

        can include an extraction schema to extract key-value pairs from the parsed

        content.


        For EU users, use this endpoint:


        `https://api.va.eu-west-1.landing.ai/v1/tools/agentic-document-analysis`.'
      operationId: tool_agentic_doc_analysis_v1_tools_agentic_document_analysis_post
      security:
      - Basic Auth: []
      parameters:
      - name: pages
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Which pages to process, separated by commas and starting from 0. For example, to process the first 3 pages, use ''0,1,2''. '
          title: Pages
        description: 'Which pages to process, separated by commas and starting from 0. For example, to process the first 3 pages, use ''0,1,2''. '
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/routers__ade__core__custom_types__DocAnalysisRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenticDocAnalysisResponse'
        '206':
          description: Contains only pages that succeeded processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgenticDocAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    head:
      tags:
      - Tools
      summary: Head Agentic Document Analysis
      operationId: head_agentic_document_analysis_v1_tools_agentic_document_analysis_head
      security:
      - Basic Auth: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/tools/markdown-schema-suggestion:
    post:
      tags:
      - Tools
      summary: Tool Markdown To Jsonschema
      description: Endpoint to convert markdown to JSON schema.
      operationId: tool_markdown_to_jsonschema_v1_tools_markdown_schema_suggestion_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkdownToJSONSchemaRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkdownToJSONSchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - Basic Auth: []
  /v1/tools/wsi-embedding:
    post:
      tags:
      - Tools
      summary: Tool Wsi Embedding
      description: 'Performs whole slide image (WSI) embedding generation for pathology image analysis and feature extraction.


        Args:

        params (WSIEmbeddingRequest): The input data containing the following fields:

        - image (bytes): Base64-encoded patch image from a whole slide image.

        - mpp (float): Microns per pixel resolution of the image patch.

        Required for proper scaling and analysis.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for WSI embedding generation.


        Returns:

        WSIEmbeddingResponse | JSONResponse

        Success: WSIEmbeddingResponse containing generated embeddings for the WSI patch.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_wsi_embedding_v1_tools_wsi_embedding_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WSIEmbeddingRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSIEmbeddingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/qr-reader:
    post:
      tags:
      - Tools
      summary: Tool Qr Reader
      description: 'Performs QR code detection and reading to extract encoded information from images.


        Args:

        params (QRReaderRequest): The input data containing the following fields:

        - image (bytes): The image file to analyze for QR code detection and reading.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for QR code processing.


        Returns:

        QRReaderResponse | JSONResponse

        Success: QRReaderResponse containing detected QR codes with decoded text and locations.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_qr_reader_v1_tools_qr_reader_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRReaderRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRReaderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/owlv2:
    post:
      tags:
      - Tools
      summary: Tool Owlv2
      description: 'Performs object detection using the OWL-ViT v2 model with text prompts.


        Args:

        params (Owlv2Request): The input request containing the following fields:

        - image (UploadFile): The image file to analyze for object detection.

        - prompts (List[str]): Text descriptions of objects to detect in the image.

        - confidence (float, *optional*): Minimum confidence threshold for detections.

        Defaults to 0.2, must be between 0 and 1.


        baseten_inference_sender: Dependency Injection for

        sending request to the baseten server.


        Returns:

        BboxResponse | JSONResponse

        List of detected objects with bounding boxes, labels, and confidence scores, or error response.'
      operationId: tool_owlv2_v1_tools_owlv2_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Owlv2Request'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BboxResponse'
                - type: 'null'
                title: Response Tool Owlv2 V1 Tools Owlv2 Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/depth-anything-v2:
    post:
      tags:
      - Tools
      summary: Tool Depth Anything V2
      description: 'Performs depth estimation on images using the Depth-Anything-V2 model to generate depth maps.


        Args:

        params (DepthAnythingV2Request): The input data containing the following fields:

        - image (bytes): The image file to analyze for depth estimation.

        - grayscale (bool, *optional*): Whether to output the depth map in grayscale format.

        Defaults to False for colored depth maps.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for Depth-Anything-V2 processing.


        Returns:

        DepthAnythingV2Response | JSONResponse

        Success: DepthAnythingV2Response containing depth map data and metadata.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_depth_anything_v2_v1_tools_depth_anything_v2_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepthAnythingV2Request'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepthAnythingV2Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/loca:
    post:
      tags:
      - Tools
      summary: Tool Loca
      description: 'Performs localized content analysis using the LOCA model to analyze specific regions or the entire image.


        Args:

        params (LocaRequest): The input data containing the following fields:

        - image (bytes): The image file to analyze for localized content analysis.

        - bbox (BoundingBox, *optional*): Bounding box coordinates to focus analysis on a specific region.

        If not provided, analyzes the entire image.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for LOCA processing.


        Returns:

        LocaResponse | JSONResponse

        Success: LocaResponse containing localized analysis results.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_loca_v1_tools_loca_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocaRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/florence2:
    post:
      tags:
      - Tools
      summary: Tool Florencev2
      description: 'Performs various computer vision tasks using the Florence V2 model.


        Args:

        params (FlorenceV2Request): The input request containing the following fields:

        - image (UploadFile, *optional*): Single image file for processing.

        - images (List[UploadFile], *optional*): Multiple image files for batch processing.

        - video_bytes (bytes, *optional*): Video data for video analysis tasks.

        - task (str): The specific task to perform (e.g., "CAPTION", "OD", "OCR").

        - prompt (str, *optional*): Text prompt for task-specific guidance.


        baseten_inference_sender: Dependency Injection for

        sending request to the baseten server.


        Returns:

        FlorenceV2Response | JSONResponse

        Task-specific results including captions, object detections, or OCR text, or error response.'
      operationId: tool_florencev2_v1_tools_florence2_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlorenceV2Request'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlorenceV2Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/nsfw-classification:
    post:
      tags:
      - Tools
      summary: Tool Nsfw Classification
      description: 'Performs NSFW (Not Safe For Work) content classification to detect inappropriate content in images.


        Args:

        params (NSFWRequest): The input data containing the following fields:

        - image (bytes): The image file to analyze for NSFW content classification.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for NSFW classification.


        Returns:

        NSFWResponse | JSONResponse

        Success: NSFWResponse containing classification scores for different content categories.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_nsfw_classification_v1_tools_nsfw_classification_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NSFWRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NSFWResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/florence2-qa:
    post:
      tags:
      - Tools
      summary: Tool Florencev2 Qa
      description: 'Performs visual question answering using the Florence2 model to answer questions about image content.


        Args:

        params (FlorenceQARequest): The input data containing the following fields:

        - image (bytes): The image file to analyze for visual question answering.

        - question (str): The question to ask about the image content.

        The model will analyze the image and provide an answer.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for Florence2 QA processing.


        Returns:

        FlorenceV2QAResponse | JSONResponse

        Success: FlorenceV2QAResponse containing the answer to the visual question.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_florencev2_qa_v1_tools_florence2_qa_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlorenceQARequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlorenceV2QAResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/pose-detector:
    post:
      tags:
      - Tools
      summary: Tool Pose Detection
      description: 'Performs human pose detection to identify and locate body keypoints and skeletal structure in images.


        Args:

        params (PoseDetectionRequest): The input data containing the following fields:

        - image (bytes): The image file to analyze for pose detection.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for pose detection processing.


        Returns:

        PoseDetectionResponse | JSONResponse

        Success: PoseDetectionResponse containing detected poses with keypoint coordinates.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_pose_detection_v1_tools_pose_detector_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PoseDetectionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoseDetectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/barcode-reader:
    post:
      tags:
      - Tools
      summary: Tool Barcode Reader
      description: 'Extracts barcode information from an image using barcode detection models.


        Args:

        params (BarcodeReaderRequest): The input request containing the following fields:

        - image (UploadFile): The image file containing barcode(s) to be detected and read.


        baseten_inference_sender: Dependency Injection for

        sending request to the baseten server.


        Returns:

        BarcodeReaderResponse | JSONResponse

        List of detected barcodes with their values and locations, or error response.'
      operationId: tool_barcode_reader_v1_tools_barcode_reader_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BarcodeReaderRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BarcodeReaderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/internlm-xcomposer2:
    post:
      tags:
      - Tools
      summary: Tool Internlm Xcomposer2
      description: 'Performs multimodal analysis using the InternLM-XComposer2 model to generate text responses from images or videos.


        Args:

        prompt (str): Text prompt to guide the analysis and response generation.

        image (UploadFile, *optional*): Image file to analyze.

        Cannot be provided together with video.

        video (UploadFile, *optional*): Video file to analyze.

        Cannot be provided together with image.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for InternLM-XComposer2 processing.


        Returns:

        InternLMXComposer2Response | JSONResponse

        Success: InternLMXComposer2Response containing generated text response.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_internlm_xcomposer2_v1_tools_internlm_xcomposer2_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_tool_internlm_xcomposer2_v1_tools_internlm_xcomposer2_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternLMXComposer2Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/video-temporal-localization:
    post:
      tags:
      - Tools
      summary: Tool Video Temporal Localization
      description: 'Performs temporal localization on videos to identify specific events or content at particular time intervals.


        Args:

        data (FormData): The form data containing the following fields:

        - prompt (str): Text prompt describing the content or event to locate in the video.

        - model (TemporalLocalizationTools): The AI model to use for temporal localization.

        Options: internlm-xcomposer2, gpt4o, qwen2vl, qwen25vl.

        - video (UploadFile): The video file to analyze for temporal content localization.

        - chunk_length (float, *optional*): Length of each processing chunk in seconds.

        - chunk_length_seconds (float, *optional*): Alternative specification for chunk length in seconds.

        - chunk_length_frames (int, *optional*): Length of each processing chunk in frame count.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for video temporal localization.


        Returns:

        VideoTemporalLocalizationResponse | JSONResponse

        Success: VideoTemporalLocalizationResponse containing temporal localization results with timestamps.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_video_temporal_localization_v1_tools_video_temporal_localization_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/routers__tools__video_temporal_localization__FormData'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTemporalLocalizationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/florence2-sam2:
    post:
      tags:
      - Tools
      summary: Tool Florence2 Sam2
      description: 'Performs object detection and segmentation using Florence2 and SAM2 models for precise instance segmentation.


        Args:

        data (FormData): The form data containing the following fields:

        - prompts (List[str]): List of text prompts describing objects to detect and segment.

        - image (UploadFile, *optional*): Image file to analyze for object detection and segmentation.

        - video (UploadFile, *optional*): Video file to analyze for temporal object segmentation.

        - chunk_length (int, *optional*): Length of video chunks for processing.

        Used for video segmentation tasks.

        - iou_threshold (float, *optional*): IoU threshold for filtering detections.

        Range: 0.1-1.0, defaults to 0.6.

        - nms_threshold (float, *optional*): Non-maximum suppression threshold.

        Range: 0.1-1.0, defaults to 1.0.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for Florence2+SAM2 processing.


        Returns:

        Florence2SAM2Response | JSONResponse

        Success: Florence2SAM2Response containing detected objects with segmentation masks.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_florence2_sam2_v1_tools_florence2_sam2_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/routers__tools__florence2_sam2__FormData'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Florence2SAM2Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/glee:
    post:
      tags:
      - Tools
      summary: Tool Glee
      description: 'Performs text-to-instance segmentation using the GLEE model to detect and segment objects based on text prompts.


        Args:

        data (FormData): The form data containing the following fields:

        - prompts (List[str]): List of text prompts describing objects to detect and segment.

        Must contain at least one prompt.

        - image (UploadFile): The image file to analyze for instance segmentation.

        Required field for segmentation analysis.

        - video (UploadFile, *optional*): Video file input (not used for GLEE).

        - nms_threshold (float, *optional*): Non-maximum suppression threshold for filtering overlapping detections.

        Helps reduce duplicate detections.

        - confidence (float, *optional*): Confidence threshold for object detection.

        Objects with lower confidence scores will be filtered out.

        baseten_inference_sender: Dependency Injection for

        sending inference requests to the Baseten model server for GLEE processing.


        Returns:

        TextToInstanceSegmentationResponse | JSONResponse

        Success: TextToInstanceSegmentationResponse containing detected instances with segmentation masks.

        Error: JSONResponse with error details and appropriate status code.'
      operationId: tool_glee_v1_tools_glee_post
      security:
      - Basic Auth: []
      parameters:
      - name: timeout
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 480
          title: Timeout
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/routers__tools__glee__FormData'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextToInstanceSegmentationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tools/text-to-object-detection:
    post:
      tags:
      - Tools
      summary: Tool Text To Od
      description: 'Performs text-to-object detection on images or videos with access to various detection models


        Args:

        data (FormData): The input data containing the following keys:

        - prompts (List[str]): List of text prompts describing objects to detect.

        Must contain at least one prompt. For Florence2,

        total prompt length cannot exceed 800 characters. For agentic,

        only one prompt is allowed.

        - model (TextToODModel): The detection model to use:

        "owlv2", "countgd", "florence2", "agentic", "glee", or "florencev2" (deprecated).

        - image (UploadFile, *optional*): The image file to analyze for object detection.

        - video (UploadFile, *optional*): The video file to analyze for object detection.

        Note: Not all models support video input.

