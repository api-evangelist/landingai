components:
  schemas:
    SpreadsheetSplit:
      properties:
        class:
          type: string
          title: Class
          description: 'Split class: ''page'' for per-sheet splits, ''full'' for single split with all content'
        identifier:
          type: string
          title: Identifier
          description: 'Split identifier: sheet name for ''page'' splits, ''full'' for full split'
        sheets:
          items:
            type: integer
          type: array
          title: Sheets
          description: 'Sheet indices: single element for ''page'' splits, all indices for ''full'' split'
        markdown:
          type: string
          title: Markdown
          description: Combined markdown for this split
        chunks:
          items:
            type: string
          type: array
          title: Chunks
          description: Chunk IDs in this split
      type: object
      required:
      - class
      - identifier
      - sheets
      - markdown
      - chunks
      title: SpreadsheetSplit
      description: 'Sheet-based split from spreadsheet parsing.


        Similar to ParseSplit but grouped by sheet instead of page.

        Supports both ''page'' (per-sheet) and ''full'' (all sheets) split types.'
    MarkdownToJSONSchemaRequest:
      properties:
        markdown:
          type: string
          title: Markdown
          description: Markdown content to analyze for schema generation
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
          description: Optional user customization prompt for schema generation
      type: object
      required:
      - markdown
      title: MarkdownToJSONSchemaRequest
    GroundingType:
      type: string
      enum:
      - chunkLogo
      - chunkCard
      - chunkAttestation
      - chunkScanCode
      - chunkForm
      - chunkTable
      - chunkFigure
      - chunkText
      - chunkMarginalia
      - chunkTitle
      - chunkPageHeader
      - chunkPageFooter
      - chunkPageNumber
      - chunkKeyValue
      - table
      - tableCell
      title: GroundingType
    routers__tools__doc_analysis__DocAnalysisRequest:
      properties:
        image:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Image
        pdf:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Pdf
        parse_text:
          type: boolean
          title: Parse Text
          default: true
        parse_tables:
          type: boolean
          title: Parse Tables
          default: true
        parse_figures:
          type: boolean
          title: Parse Figures
          default: true
        summary_verbosity:
          $ref: '#/components/schemas/Verbosity'
          default: normal
        return_chunk_crops:
          type: boolean
          title: Return Chunk Crops
          default: false
        return_page_crops:
          type: boolean
          title: Return Page Crops
          default: false
        caption_format:
          $ref: '#/components/schemas/OutputFormat'
          default: json
        response_format:
          $ref: '#/components/schemas/OutputFormat'
          default: json
        filename:
          anyOf:
          - type: string
