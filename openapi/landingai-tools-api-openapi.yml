    routers__ade__core__custom_types__DocAnalysisRequest:
      properties:
        pdf:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Pdf
          description: A PDF file to be analyzed (50 pages max). Either this parameter or the `image` parameter must be provided.
        image:
          anyOf:
          - type: string
            format: binary
          - type: 'null'
          title: Image
          description: An image representing the document to analyse (50MB max). The image must be a valid image file (PNG, JPEG, etc.). Either this parameter or `pdf` parameter must be provided.
        include_marginalia:
          type: boolean
          title: Include Marginalia
          description: Whether to include marginalia (headers, footers, notes in margins, etc.) in the response.
          default: true
        include_metadata_in_markdown:
          type: boolean
          title: Include Metadata In Markdown
          description: Whether to include metadata in the Markdown output.
          default: true
        fields_schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Fields Schema
          description: JSON schema for field extraction from the document. This schema extracts structured data from the document. If provided, the response includes an `extracted_schema` object with the extracted data and an `extraction_metadata` object with the visual grounding metadata. The schema must be a valid JSON object and will be validated before processing the document.
        figure_captioning_type:
          $ref: '#/components/schemas/ImageCaptioningType'
          description: How to caption images (verbose, transcribe, or custom).
          default: verbose
        figure_captioning_prompt:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Figure Captioning Prompt
          description: Custom prompt for image captioning.
        split:
          $ref: '#/components/schemas/ChunkingType'
          description: 'How to return markdown content: ''full'' returns the complete document markdown as a single string, ''page'' returns a list of strings with markdown for each page.'
          default: full
        enable_rotation_detection:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Rotation Detection
          description: Enable automatic rotation detection and correction for document pages. When enabled, the system will detect if pages are rotated and automatically correct text and table chunks for better extraction accuracy.
        enable_skew_detection:
          type: boolean
          title: Enable Skew Detection
          description: Enable automatic skew detection and correction for document pages. When enabled, the system will detect if pages are skewed and automatically correct text and table chunks for better extraction accuracy.
          default: false
      type: object
      title: DocAnalysisRequest
    ExtractJobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: A unique identifier for this extract job.
        status:
          type: string
          title: Status
          description: 'The current state of the job: `pending`, `processing`, `completed`, `failed`, or `cancelled`.'
        received_at:
          type: integer
          title: Received At
          description: Unix timestamp (in seconds) for when the job was received.
        created_at:
          type: integer
          title: Created At
          description: Unix timestamp (in seconds) for when the job was created.
          default: 0
        progress:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Progress
          description: Job completion. Either 0.0 (not yet complete) or 1.0 (complete).
        org_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Org Id
          description: Organization ID.
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
          description: The exact model snapshot used for the extraction.
        data:
          anyOf:
          - $ref: '#/components/schemas/ExtractResponse'
          - type: 'null'
          description: The extraction results, returned here when the job is complete and you did not set an `output_save_url`. Large results are returned through `output_url` instead.
        output_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Output Url
          description: A URL to download the extraction results. Provided when the job is complete and either you set an `output_save_url` or the result is larger than 1 MB. URLs for large results are temporary and expire one hour after you request the job.
        metadata:
          anyOf:
          - $ref: '#/components/schemas/ExtractMetadata'
          - type: 'null'
          description: Information about the extraction, such as the model version, duration, credit usage, and any schema warnings.
        failure_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Reason
          description: If the job failed, a message describing what went wrong.
      type: object
      required:
      - job_id
      - status
      - received_at
      - progress
      title: ExtractJobStatusResponse
      description: The status of an extract job, plus the results once it completes.
