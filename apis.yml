aid: landingai
name: Landing.ai
description: >-
  LandingAI, founded by Andrew Ng, builds production AI for visual and document
  understanding. Its flagship product is Agentic Document Extraction (ADE),
  which converts real-world documents — PDFs, images, Office files and
  spreadsheets — into structured, auditable data. ADE exposes a family of REST
  APIs: Parse (document to reading-order Markdown plus hierarchical blocks with
  per-block visual grounding), Extract (schema-driven field extraction with
  character-span grounding back into the source), Build Extract Schema, and the
  preview Classify, Section and Split APIs, each available synchronously or as
  asynchronous Jobs for large files. The current generation runs on the DPT-3
  document pre-trained transformer. LandingAI also operates LandingLens, a
  computer-vision platform API for creating projects, uploading images, defining
  classes, training models and deploying them to LandingAI-hosted cloud
  endpoints, plus a Vision Tools API surfacing OWLv2, Florence-2, SAM2,
  CountGD, Depth Anything, PaddleOCR and other vision models as HTTP tools. The
  company ships official Python and TypeScript ADE libraries, a hosted remote MCP
  server, published Agent Skills, an llms.txt agent surface, US and EU data
  residency, and SOC 2 Type II, HIPAA and GDPR compliance with a zero data
  retention option.
